<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta name="theme-color" content="#0a2b2c" />

  <title>Login Admin | Masjid Noor Islam</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="admin.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="login-body">

  <main class="login-page">

    <section class="login-card">

      <div class="login-brand">

        <div class="login-logo-wrap">
          <img
            src="../Infaq/qr/Logo Masjid.png"
            alt="Logo Masjid Noor Islam"
            class="login-logo"
          />
        </div>

        <div>
          <div class="login-eyebrow">
            Portal Pengurus
          </div>

          <h1>
            Masjid Noor Islam
          </h1>

          <p>
            Masuk untuk mengelola informasi website masjid.
          </p>
        </div>

      </div>


      <form
        id="loginForm"
        class="login-form"
      >

        <div class="field">

          <label for="loginEmail">
            Email
          </label>

          <input
            type="email"
            id="loginEmail"
            autocomplete="email"
            placeholder="admin@noorislam.com"
            required
          />

        </div>


        <div class="field">

          <label for="loginPassword">
            Password
          </label>

          <input
            type="password"
            id="loginPassword"
            autocomplete="current-password"
            placeholder="Masukkan password"
            required
          />

        </div>


        <button
          type="submit"
          class="btn-primary full"
          id="loginButton"
        >
          Masuk Dashboard
        </button>


        <div
          class="form-message"
          id="loginMessage"
        ></div>

      </form>


      <a
        href="../index.html"
        class="back-home"
      >
        ← Kembali ke website
      </a>

    </section>

  </main>


  <script src="admin.js"></script>

</body>
</html>
